<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../project-scroll.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图匠室工作台｜项目介绍</title>
<style>
:root { color-scheme: light; --folder-accent: #593184; }
* { box-sizing: border-box; }
body { margin: 0; background: #f8f5fb; color: #2d2238; font: 16px/1.7 system-ui, "Microsoft YaHei", sans-serif; }
.studio-case { max-width: 960px; margin-inline: auto; padding: clamp(18px, 5vw, 48px); }
.case-header h1 { margin: 0; font-size: clamp(30px, 6vw, 54px); line-height: 1.2; }
.case-header p { margin: 12px 0 0; max-width: 46em; }
.case-header .case-label { margin: 0 0 10px; font-size: .75rem; color: #593184; letter-spacing: .08em; }
.studio-case { display: grid; gap: 18px; }
.studio-case h3, .studio-case h4 { margin: 0; }
.studio-live {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 8px;
  background: #593184;
  color: white;
  text-decoration: none;
  font-weight: 750;
}
.studio-live:hover { background: #452366; }
.studio-live:focus-visible { outline: 2px solid #593184; outline-offset: 3px; }
.studio-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.studio-guide { background: #eee5f6; color: #452366; border: 1px solid #cdb9e1; }
.studio-guide:hover { background: #dfcfee; }
.studio-case figure { margin: 0; overflow: hidden; border: 1px solid #dcd0e9; border-radius: 12px; background: #fff; }
.studio-case img { display: block; width: 100%; height: auto; }
.studio-case figcaption { display: grid; gap: 6px; padding: 13px 15px; }
.studio-case figcaption p { margin: 0; font: inherit; font-size: .85rem; line-height: 1.65; }
.studio-case figcaption h4 { color: var(--folder-accent); }
</style>
</head>
<body>
<main class="studio-case">
      <header class="case-header">
        <p class="case-label">AI PRODUCT · E-COMMERCE</p>
        <h1>图匠室工作台</h1>
        <p>上传一张商品图，填写名称和卖点。图匠室根据品类生成三张各有用途的上新图，也支持用已有商品资料制作大促套图。</p>
      </header>
      <div class="studio-actions">
        <a class="studio-live" href="https://chenip1.github.io/E-commerce_design/" target="_blank" rel="noopener noreferrer">在线体验 <span aria-hidden="true">↗</span></a>
        <a class="studio-live studio-guide" href="../../tujiang/tujiang-user-guide.pdf" target="_blank" rel="noopener noreferrer" type="application/pdf">产品使用说明 <span aria-hidden="true">↗</span></a>
      </div>
      <h3>创新亮点</h3>
      <figure>
        <figcaption>
          <h4>01 · 从买家要确认的信息决定套图</h4>
          <p>把制图的起点从挑通用模板改为选商品品类。工作台按品类给出素材要求、图型和排版。零食突出酥脆口感和份量，3C 数码展示结构与参数，美妆呈现质地和试色，服饰交代版型、面料和尺码。首页用一张耳机原图演示了三个输出：产品主视觉、结构细节图和参数信息图。</p>
        </figcaption>
        <img src="../../tujiang/home-current.png" alt="图匠室新版首页左侧是耳机原商品图，右侧是产品主视觉、结构细节图和参数信息图。">
      </figure>
      <figure>
        <figcaption>
          <h4>02 · 用已有套图快速换大促主题</h4>
          <p>旧商品的图片和卖点已经备齐，卖家从原项目进入「大促换图」，切换 618、双十一或年货节，即可预览对应风格。图中的耳机沿用同一张商品原图，活动文案和提示词可以调整，最终将首图 A/B 和 9:16 大促海报一起导出。</p>
        </figcaption>
        <img src="../../tujiang/campaign-workbench.jpg" alt="耳机项目的大促换图工作台，顶部可选 618、双十一、年货节，左侧预览年货节海报，右侧对比首图 A 和首图 B。">
      </figure>
      <figure>
        <figcaption>
          <h4>03 · 用技能中心复用提示词和制图方法</h4>
          <p>把写好的提示词保存为「创作风格模板」，也可以直接创建或从外部文件导入。模板按品类整理，做下一款商品时，可在「创作方向」预览并选用，再按商品特点调整。「Skill 大全」还支持从 GitHub 公开仓库导入开源 Skill 的说明，把其中的步骤和检查要点用作制图参考。</p>
        </figcaption>
        <img src="../../tujiang/skills-current.png" alt="图匠室技能中心，创作风格模板提供创建、导入和品类筛选，图中展示零食和 3C 数码模板。" loading="lazy">
      </figure>
    </main>
</body>
</html>
